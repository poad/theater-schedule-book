name: Deploy solid.js site to Cloudflare Pages

on:
  pull_request:
    branches:
      - main
  push:
    branches: ['main']

  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  deployments: write

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
      deployments: write

    if: ${{ (github.event.pull_request && github.event.pull_request.draft == true) || !github.event.pull_request }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          touch .env.local
          echo "VITE_SUPABASE_URL=${VITE_SUPABASE_URL}" >> .env.local
          echo "VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}" >> .env.local

      - name: Build
        run: pnpm build

      - name: Publish to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 189f193d40c08d2618ee4b94de81d79e
          packageManager: pnpm
          command: |
            pages project list
            pages deploy ./dist --project-name=${{ github.event.repository.name }} --branch=${DEPLOY_BRANCH:-main}

          # projectName: ${{ github.event.repository.name }}
          # directory: ./dist
          # # Optional: Enable this if you want to have GitHub Deployments triggered
          # gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # # Optional: Switch what branch you are publishing to.
          # # By default this will be the branch which triggered this workflow
          # branch: main

          # Optional: Change the working directory
          workingDirectory: ./
        env:
          DEPLOY_BRANCH: ${{ github.head_ref }}

      - name: Write deployment URL to summary
        run: |
          {
            echo '## Deployment'
            echo ''
            if [ -n "${{ steps.deploy.outputs.deployment-url }}" ]; then
              echo "- Deployment: ${{ steps.deploy.outputs.deployment-url }}"
            fi
            if [ -n "${{ steps.deploy.outputs.pages-deployment-alias-url }}" ]; then
              echo "- Alias: ${{ steps.deploy.outputs.pages-deployment-alias-url }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
