packages:
  - .

allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false
  workerd: false

blockExoticSubdeps: true

engineStrict: true

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - pnpm@12.17.0
  - minimatch@11.0.1
  - glob@14.0.2
  - '@isaacs/nonrecursive-glob-match@1.0.1'
  - path-scurry@3.0.0

overrides:
  chokidar: '>=5'
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  minimatch@<11.0.1: ^11.0.1
  semver: '>=7'
  undici@>=7.0.0 <7.30.1: ^7.30.1

trustPolicy: no-downgrade
