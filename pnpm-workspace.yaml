packages:
  - .

allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false
  workerd: false

blockExoticSubdeps: true

engineStrict: true

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - pnpm@12.19.1
  - source-map-js@1.2.2

overrides:
  chokidar: '>=5'
  semver: '>=7'
  seroval@<=1.6.2: ^1.6.3
  sharp@<0.35.4: ^0.35.4
  sharp@<0.35.5: ^0.35.5
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  undici@>=7.28.0 <7.29.1: ^7.29.1

trustPolicy: no-downgrade
